name: Deploy academic profile

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/build-profile.mjs", "scripts/check-profile.py", ".github/workflows/deploy.yml"]
  pull_request:
    branches: [main]
    paths: ["site/**", "scripts/build-profile.mjs", "scripts/check-profile.py", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check JavaScript and render profile
        run: |
          node --check site/content.js
          node --check site/app.js
          node scripts/build-profile.mjs
          python3 scripts/check-profile.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish profile
        id: deployment
        uses: actions/deploy-pages@v4
