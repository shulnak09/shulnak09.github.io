    Experience:
      - company: Clemson University
        position: Postdoctoral Scholar
        location: Clemson, SC, USA
        start_date: 2025-11
        end_date: present
        highlights:
          - Developed a belief-aware vision-language model with memory retrieval for long-horizon intent inference and human-like reasoning.
          - Proposed MA-VLCM, which replaces a learned critic with a pretrained vision-language model to improve sample efficiency and support zero-shot-generalizable multi-agent policies.

      - company: Virginia Tech Transportation Institute
        position: Research Associate
        location: Blacksburg, VA, USA
        start_date: 2025-01
        end_date: 2025-10
        highlights:
          - Enhanced long-range detection using camera and range sensors for autonomous emergency braking.
          - Simulated rainy conditions using monocular depth estimation and physics-based particles to study sensor degradation.

      - company: Honda Research Institute
        position: Research Intern
        location: San Jose, CA, USA
        start_date: 2024-02
        end_date: 2024-05
        highlights:
          - "Adviser: Dr. Songpo Li"
          - Developed a seven-degree-of-freedom human arm model using model predictive control for coordinated reaching and orientation.
          - Optimized cost-function weights to generate human-like trajectories and validated them against upper-limb motion data.

      - company: Virginia Tech
        position: Research Assistant
        location: Blacksburg, VA, USA
        start_date: 2021-01
        end_date: 2024-12
        highlights:
          - "Adviser: Dr. Azim Eskandarian"
          - Developed uncertainty-aware social-navigation planners using chance constraints and control barrier functions.
          - Learned vision-based potential-field cost maps for obstacle avoidance.
          - Built a sequence-to-sequence Kalman-filter surrogate with deep ensembles to propagate sensing uncertainty.
          - Applied Monte Carlo dropout for Bayesian trajectory prediction, improving accuracy by 15% over deterministic models.
          - Designed cooperative prediction for occluded objects in GPS-denied environments.
          - Proposed a Gaussian-process-based probabilistic RRT for proactive collision avoidance.
          - Deployed the ROS/CARMA-based autonomous X-CAR platform with SLAM, V2V communication, waypoint generation, and data processing.


      - company: Virginia Tech
        position: Graduate Student Researcher
        location: Blacksburg, VA, USA
        start_date: 2018-08
        end_date: 2020-12
        highlights:
          - "Adviser: Dr. Hodjat Pendar"
          - Designed a robotic fish to investigate how caudal-fin flexibility, shape, and thickness affect propulsion performance.
          - Developed a numerical model of fish dynamics and compared thrust and efficiency between freely swimming and tethered fish.

